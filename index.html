<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eaf5ef">
    <title>Local Forecast | Dynamic Weather</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="weather-card">
        <header class="app-header">
            <p class="eyebrow">WEATHER, CLOSER TO HOME</p>
            <h1>Local forecast</h1>
            <p class="intro">Choose a place to see its current conditions.</p>
        </header>

        <form id="locationForm" class="location-form" novalidate>
            <div class="location-grid">
                <div class="field">
                    <label for="countryInput">Country</label>
                    <input id="countryInput" list="countryOptions" autocomplete="off" placeholder="Search countries" required>
                    <datalist id="countryOptions"></datalist>
                </div>
                <div class="field">
                    <label for="stateInput">State / region</label>
                    <input id="stateInput" list="stateOptions" autocomplete="off" placeholder="Choose a country first" disabled required>
                    <datalist id="stateOptions"></datalist>
                </div>
                <div class="field">
                    <label for="districtInput">District</label>
                    <input id="districtInput" list="districtOptions" autocomplete="off" placeholder="Choose a state first" disabled required>
                    <datalist id="districtOptions"></datalist>
                </div>
                <div class="field">
                    <label for="cityInput">City / locality</label>
                    <input id="cityInput" list="cityOptions" autocomplete="off" placeholder="Choose a district first" disabled required>
                    <datalist id="cityOptions"></datalist>
                </div>
            </div>
            <p id="locationStatus" class="status" role="status" aria-live="polite"></p>
            <button id="weatherButton" type="submit" disabled>
                <span>Get weather</span><span aria-hidden="true">&#8594;</span>
            </button>
        </form>

        <section id="weatherPanel" class="weather-panel" aria-live="polite" aria-label="Current weather"></section>
        <p id="weatherStatus" class="status weather-status" role="status" aria-live="polite"></p>
        <footer>
            <span>WeatherAPI when configured; Open-Meteo otherwise.</span>
            <a href="https://www.geonames.org" target="_blank" rel="noreferrer">Location data © GeoNames, CC BY 4.0.</a>
            <a href="https://open-meteo.com" target="_blank" rel="noreferrer">Open-Meteo</a>
        </footer>
    </main>
</body>
</html>
